<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Ant Design X Blazor · Demo</title>
  <link rel="icon" type="image/svg+xml" href="antdesign-x-blazor-logo.svg" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <script>
    // GitHub Pages SPA 兜底：把 /xxx 重定向到 /?p=/xxx，由 index.html 还原。
    (function () {
      var l = window.location;
      var base = '/';
      if (base.charAt(base.length - 1) !== '/') {
        base += '/';
      }

      var basePath = base.replace(/\/$/, '');
      var pathname = l.pathname;
      var rest = pathname;

      if (basePath && pathname.toLowerCase() === basePath.toLowerCase()) {
        rest = '/';
      } else if (basePath && pathname.toLowerCase().indexOf(basePath.toLowerCase() + '/') === 0) {
        rest = pathname.substring(basePath.length);
      }

      if (rest.charAt(0) !== '/') {
        rest = '/' + rest;
      }

      l.replace(base + '?p=' + encodeURIComponent(rest) + l.search.replace(/^\?/, '&') + l.hash);
    })();
  </script>
</head>
<body></body>
</html>
