name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    name: build-test-pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AntDesignXBlazor.slnx

      - name: Build
        run: dotnet build AntDesignXBlazor.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AntDesignXBlazor.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/AntDesign.X.Blazor/AntDesign.X.Blazor.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
