name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    name: build-test-pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AntDesignXBlazor.slnx

      - name: Build
        run: dotnet build AntDesignXBlazor.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AntDesignXBlazor.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/AntDesign.X.Blazor/AntDesign.X.Blazor.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg

  publish-nuget:
    name: Publish to NuGet (tag v*)
    needs: build-test-pack
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: $VERSION"

      - name: Pack with tag version
        run: |
          dotnet pack src/AntDesign.X.Blazor/AntDesign.X.Blazor.csproj \
            --configuration Release \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            --output ./artifacts

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error ::Repository/Org secret NUGET_API_KEY is not set."
            exit 1
          fi

          shopt -s nullglob

          packages=(./artifacts/*.nupkg)
          symbols=(./artifacts/*.snupkg)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error ::No .nupkg packages found in ./artifacts."
            exit 1
          fi

          for package in "${packages[@]}"; do
            # Upload the package alone first; the symbol package is pushed separately.
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate \
              --no-symbols
          done

          if [ ${#symbols[@]} -eq 0 ]; then
            echo "No .snupkg symbol packages found in ./artifacts."
            exit 0
          fi

          PACKAGE_ID="AntDesign.X.Blazor"
          PACKAGE_ID_LOWER="${PACKAGE_ID,,}"
          PACKAGE_FILE_NAME="$(basename "${packages[0]}")"
          PACKAGE_VERSION_FROM_FILE="${PACKAGE_FILE_NAME#${PACKAGE_ID}.}"
          PACKAGE_VERSION_FROM_FILE="${PACKAGE_VERSION_FROM_FILE%.nupkg}"
          PACKAGE_VERSION_LOWER="${PACKAGE_VERSION_FROM_FILE,,}"
          PACKAGE_URL="https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID_LOWER}/${PACKAGE_VERSION_LOWER}/${PACKAGE_ID_LOWER}.${PACKAGE_VERSION_LOWER}.nupkg"

          # NuGet.org can accept the package before the symbol endpoint recognizes it.
          echo "Waiting for NuGet.org to index ${PACKAGE_ID} ${PACKAGE_VERSION_FROM_FILE} before pushing symbols..."
          for attempt in {1..90}; do
            if curl --fail --silent --location --output /dev/null "$PACKAGE_URL"; then
              echo "NuGet.org package is visible."
              break
            fi

            if [ "$attempt" -eq 90 ]; then
              echo "::error ::Package ${PACKAGE_ID} ${PACKAGE_VERSION_FROM_FILE} was not visible on NuGet.org after waiting."
              exit 1
            fi

            sleep 10
          done

          for symbol_package in "${symbols[@]}"; do
            dotnet nuget push "$symbol_package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  deploy-pages:
    name: Deploy demo (AOT) to GitHub Pages
    needs: build-test-pack
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload (AOT)
        run: dotnet workload install wasm-tools

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Publish Wasm demo (Release + AOT)
        run: |
          dotnet publish examples/AntDesign.X.Blazor.Demo.Wasm/AntDesign.X.Blazor.Demo.Wasm.csproj \
            --configuration Release \
            -p:RunAOTCompilation=true \
            -p:WasmStripILAfterAOT=true \
            --output ./publish

      - name: Rewrite base href + SPA 404 fallback
        run: |
          PAGES_BASE_PATH="${{ steps.pages.outputs.base_path }}"
          BASE="/"
          WWWROOT="./publish/wwwroot"
          if [ -n "$PAGES_BASE_PATH" ]; then
            BASE="${PAGES_BASE_PATH%/}/"
          fi
          echo "Setting <base href=\"$BASE\"> in $WWWROOT/index.html"
          sed -i "s#<base href=\"/\" />#<base href=\"$BASE\" />#g" "$WWWROOT/index.html"
          if [ -f "$WWWROOT/404.html" ]; then
            sed -i "s#var base = '/';#var base = '$BASE';#g" "$WWWROOT/404.html"
          else
            cp "$WWWROOT/index.html" "$WWWROOT/404.html"
          fi
          # GitHub Pages 对 .nojekyll 必须存在，避免 _framework 被忽略
          touch "$WWWROOT/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
